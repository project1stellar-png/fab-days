<!doctype html><html lang="zh-CN" data-ja-title="学習記録 · Fab Days"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="description" content="CMP 学习记录汇总，可打印。"><title>学习记录 · Fab Days</title><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231a343e'/%3E%3Ccircle cx='16' cy='16' r='10' fill='%236de1cc'/%3E%3Cpath d='M9 9h14v14H9zM16 6v20M6 16h20' fill='none' stroke='%231a343e' stroke-width='2'/%3E%3C/svg%3E"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#11232c"><link rel="apple-touch-icon" href="assets/icons/icon-180.png">
<style>
:root{--ink:#16292f;--muted:#5b6f75;--line:#c9d6d8;--accent:#1f7a68}
*{box-sizing:border-box}body{margin:0;background:#e9eff0;color:var(--ink);font:15px/1.7 system-ui,-apple-system,"Segoe UI","Hiragino Sans","Yu Gothic","Microsoft YaHei",sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;max-width:900px;margin:16px auto 0;padding:0 16px}.bar a{color:var(--accent);font-size:14px;margin-left:auto}.bar button{font:inherit;font-size:14px;padding:8px 16px;border:1px solid #9fb4b8;border-radius:6px;background:#fff;color:var(--ink);cursor:pointer}.bar .primary{background:var(--accent);border-color:var(--accent);color:#fff}
#sheet{max-width:900px;margin:14px auto 40px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:34px 40px}
.recHead{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:8px}h1{font-size:24px;margin:0}h2{font-size:16px;margin:24px 0 8px;color:var(--accent)}
.recMeta{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);align-items:flex-end}.recMeta input{font:inherit;font-size:15px;color:var(--ink);border:0;border-bottom:1px solid var(--line);padding:2px 4px;margin-left:8px;width:200px}
.recTiles{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.recTiles div{border:1px solid var(--line);border-radius:6px;padding:10px;text-align:center}.recTiles b{display:block;font-size:20px}.recTiles span{font-size:11px;color:var(--muted);line-height:1.4;display:block}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:top}th{color:var(--muted);font-weight:500;font-size:12px}
.muted{color:var(--muted);font-size:12px;margin:6px 0}.recFoot{margin-top:28px;border-top:1px solid var(--line);padding-top:10px;font-size:11px;color:var(--muted)}
@media(max-width:700px){#sheet{padding:20px 16px}.recTiles{grid-template-columns:repeat(2,1fr)}.recMeta{align-items:flex-start}}
@media print{body{background:#fff}.bar{display:none}#sheet{border:0;margin:0;max-width:none;padding:0}section{break-inside:avoid}.recMeta input{border-bottom:0}}
</style>
<script defer src="i18n.js"></script><script defer src="simulator.js"></script><script defer src="knowledge.js"></script><script defer src="flowdata.js"></script><script defer src="safetydata.js"></script><script defer src="record.js"></script><script defer src="pwa.js"></script></head><body>

</body></html>
